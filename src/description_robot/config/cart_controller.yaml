controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cart_effort_controller:
      type: effort_controllers/JointGroupEffortController

cart_effort_controller:
  ros__parameters:
    joints:
      - joint_encorder_motor

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
# Omitting 'joints' and 'interfaces' lets it automatically 
# broadcast position/velocity for ALL joints defined in URDF